site_name: Sadame
site_description: Configuration management in plain Ruby, in one binary.
site_url: https://enderkus.github.io/sadame/
repo_url: https://github.com/enderkus/sadame
repo_name: enderkus/sadame
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Ender Kus. Released under the MIT License.

theme:
  name: material
  # overrides/main.html adds link-preview tags (Open Graph, Twitter cards).
  custom_dir: overrides
  # The light-scheme logo; docs/stylesheets/extra.css swaps in
  # logo-white.png on the dark scheme.
  logo: assets/logo-black.png
  favicon: assets/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: red
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: red
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - toc.follow

extra_css:
  - stylesheets/extra.css

# Icons in the footer of every page.
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/enderkus/sadame
      name: Sadame on GitHub
    - icon: fontawesome/brands/x-twitter
      link: https://x.com/sadame_rb
      name: "@sadame_rb on X"

# Captured terminal sessions are embedded into pages, not published alone;
# launch/ holds drafts for posts elsewhere.
exclude_docs: |
  transcripts/
  launch/

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  # Material's icons, such as :octicons-arrow-right-24: on the home page.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  # Code from examples/ is embedded with --8<-- "examples/...", so the docs
  # always show the files the tests run. Terminal output comes from
  # docs/transcripts/, captured with `rake docs:transcripts`.
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

# The order follows a reader's path: install, first recipe, concepts, then
# depth. The home page's three cards send users, recipe authors and
# contributors to their starting points.
nav:
  - Home: index.md
  - Install: install.md
  - Getting started: getting-started.md
  - Concepts:
      - "plan, apply, drift": concepts/plan-apply-drift.md
  - Recipes:
      - Recipe basics: recipes/basics.md
      - Inventory: recipes/inventory.md
      - Facts: recipes/facts.md
      - Tags: recipes/tags.md
      - Notifications: recipes/notifications.md
  - Resources:
      - package: resources/package.md
      - file: resources/file.md
      - line: resources/line.md
      - directory: resources/directory.md
      - link: resources/link.md
      - service: resources/service.md
      - exec: resources/exec.md
      - user: resources/user.md
      - group: resources/group.md
      - git: resources/git.md
  - Guides:
      - Provision a new VPS: guides/provision-a-new-vps.md
      - Remote hosts: guides/remote-hosts.md
      - Drift in CI: guides/drift-in-ci.md
      - Team workflow: guides/team-workflow.md
      - Sharing recipes: guides/sharing-recipes.md
      - Editor support: guides/editors.md
      - Omarchy workstation: guides/omarchy-workstation.md
      - Migrate from Ansible: guides/migrate-from-ansible.md
      - Migrate from Itamae: guides/migrate-from-itamae.md
      - FAQ: faq.md
  - Examples: examples/index.md
  - Reference:
      - Command line: reference/cli.md
      - JSON output: reference/json-output.md
      - Exit codes: reference/exit-codes.md
  - Comparison: comparison.md
  - Contributing:
      - Overview: contributing/index.md
      - Architecture: contributing/architecture.md
      - Building: contributing/building.md
      - Testing: contributing/testing.md
  - Changelog: changelog.md
