# Builds the release binaries and verifies them. Called by ci.yml on every
# push and pull request, and by release.yml before publishing.
name: Build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  linux:
    name: Build linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Cache mruby and gem sources
        uses: actions/cache@v6
        with:
          path: |
            vendor
            build/linux-${{ matrix.arch }}/repos
          key: mruby-linux-${{ matrix.arch }}-${{ hashFiles('Rakefile', 'build_config.rb.lock') }}
      - run: bundle exec rake build:linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@v7
        with:
          name: sadame-linux-${{ matrix.arch }}
          path: dist/sadame-linux-${{ matrix.arch }}
          if-no-files-found: error

  macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Cache mruby and gem sources
        uses: actions/cache@v6
        with:
          path: |
            vendor
            build/darwin-arm64/repos
            build/darwin-amd64/repos
          key: mruby-macos-${{ hashFiles('Rakefile', 'build_config.rb.lock') }}
      - run: bundle exec rake build:macos
      - run: file dist/sadame-darwin-arm64 dist/sadame-darwin-amd64
      - run: bundle exec rake verify:macos
      - uses: actions/upload-artifact@v7
        with:
          name: sadame-darwin
          path: dist/sadame-darwin-*
          if-no-files-found: error

  verify-linux:
    name: Verify Linux binaries
    needs: linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - uses: actions/download-artifact@v8
        with:
          pattern: sadame-linux-*
          path: dist
          merge-multiple: true
      - run: chmod 0755 dist/sadame-linux-*
      - name: Both binaries are static
        run: |
          file dist/sadame-linux-amd64 dist/sadame-linux-arm64
          file dist/sadame-linux-amd64 | grep -q "x86-64.*statically linked"
          file dist/sadame-linux-arm64 | grep -q "aarch64.*statically linked"
      # The arm64 binary runs on this amd64 runner under QEMU.
      - name: Register QEMU for arm64
        run: docker run --privileged --rm tonistiigi/binfmt --install arm64
      - run: bundle exec rake verify:linux-amd64
      - run: bundle exec rake verify:linux-arm64

  installer:
    name: Test install.sh
    needs: [linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - uses: actions/download-artifact@v8
        with:
          pattern: sadame-*
          path: dist
          merge-multiple: true
      - run: chmod 0755 dist/sadame-*
      - run: bundle exec rake checksums
      - run: script/build/test-install.sh
