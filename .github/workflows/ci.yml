name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cruby:
    name: Tests on CRuby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4"]
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test:cruby

  mruby:
    name: Tests on mruby
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y bison
      - name: Cache mruby and gem sources
        uses: actions/cache@v6
        with:
          path: |
            vendor
            build/repos
          key: mruby-sources-${{ runner.os }}-${{ hashFiles('Rakefile', 'build_config.rb.lock') }}
      - run: bundle exec rake test:mruby
      - name: Smoke test the binary
        run: |
          build/host/bin/sadame --version
          build/host/bin/sadame plan examples/01-hello
          build/host/bin/sadame apply examples/01-hello
          build/host/bin/sadame plan examples/01-hello --json
      # The same pattern as docs/guides/drift-in-ci.md, on the runner itself:
      # no drift after apply, exit 1 once the file is edited.
      - name: Drift check
        run: |
          build/host/bin/sadame drift examples/01-hello --json > drift.json
          echo "edited by hand" > /tmp/sadame-hello.txt
          status=0
          build/host/bin/sadame drift examples/01-hello || status=$?
          test "$status" -eq 1
      - name: Keep the drift report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: drift-report
          path: drift.json

  build:
    name: Release binaries
    uses: ./.github/workflows/build.yml
