name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The Docker, push-mode and release jobs of the Ruby build are gone until
# those layers are adapted to the C++ and Guile binary; see
# docs/contributing/building.md.
jobs:
  test:
    name: Unit tests and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y g++ make pkg-config guile-3.0-dev
      - run: make test
      - name: Smoke test the binary
        run: |
          build/sadame --version
          build/sadame validate examples/01-hello
          build/sadame plan examples/01-hello
          build/sadame apply examples/01-hello
          build/sadame plan examples/01-hello --json
      # The same pattern as docs/guides/drift-in-ci.md, on the runner itself:
      # no drift after apply, exit 1 once the file is edited.
      - name: Drift check
        run: |
          build/sadame drift examples/01-hello --json > drift.json
          echo "edited by hand" > /tmp/sadame-hello.txt
          status=0
          build/sadame drift examples/01-hello || status=$?
          test "$status" -eq 1
      - name: Keep the drift report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: drift-report
          path: drift.json
