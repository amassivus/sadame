# Checks a server for drift in scheduled pipelines and fails the job when it
# differs from the recipe. The JSON report is kept as an artifact either way.
#
# Add this job to .gitlab-ci.yml in the project that holds your recipe and
# create a pipeline schedule. It needs:
#   - sadame installed on the server, and passwordless sudo for the SSH user;
#   - CI/CD variables SSH_PRIVATE_KEY and SSH_KNOWN_HOSTS (masked, protected).
drift:
  image: alpine:3.20
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
  variables:
    SSH_TARGET: deploy@web1.example.com
    RECIPE_DIR: site
  before_script:
    - apk add --no-cache openssh-client
    - install -d -m 0700 ~/.ssh
    - printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
    - chmod 0600 ~/.ssh/id_ed25519
    - printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
  script:
    - ssh "$SSH_TARGET" 'rm -rf sadame-recipe'
    - scp -r "$RECIPE_DIR" "$SSH_TARGET:sadame-recipe"
    # ssh exits with sadame's status: 0 no drift, 1 drift, 2 error.
    - ssh "$SSH_TARGET" 'sudo sadame drift sadame-recipe --json' > drift.json
  artifacts:
    when: always
    paths:
      - drift.json
    expire_in: 30 days
